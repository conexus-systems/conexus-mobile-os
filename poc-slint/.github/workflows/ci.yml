name: Slint PoC CI

on:
  push:
    branches: [main, poc/slint]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-linux:
    name: Check Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libasound2-dev \
            libssl-dev \
            cmake \
            pkg-config
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check formatting
        run: cargo fmt --check
      
      - name: Run clippy
        run: cargo clippy -- -D warnings
      
      - name: Build (Linux)
        run: cargo build --release --target x86_64-unknown-linux-gnu
      
      - name: Run tests
        run: cargo test --target x86_64-unknown-linux-gnu
      
      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  check-android:
    name: Check Android (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build (Android)
        run: cargo build --release --target aarch64-linux-android
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
      
      - name: Verify APK structure
        run: |
          # Check if Android build artifacts exist
          find target -name "*.apk" -o -name "*.so" | head -20

  a11y-audit:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    needs: [check-linux]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install axe-cli
        run: npm install -g @axe-core/cli
      
      - name: Build debug for a11y testing
        run: cargo build --target x86_64-unknown-linux-gnu
      
      - name: Start app for a11y testing
        run: |
          # Start the app in background
          ./target/debug/conexus-poc-slint &
          APP_PID=$!
          sleep 5
          
          # Run axe-core scan
          npx axe-cli http://localhost:3000 --save report.json --exit
          
          # Kill app
          kill $APP_PID
      
      - name: Upload a11y report
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report-slint
          path: report.json

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      
      - name: Run cargo-audit
        run: cargo audit
      
      - name: Run cargo-deny
        run: cargo deny check
        continue-on-error: true

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [check-linux]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu
      
      - name: Run benchmarks
        run: |
          # Quick performance check
          echo "Binary size:"
          ls -lh target/release/conexus-poc-slint
          
          # Frame timing would require running the app
          echo "Performance baseline recorded"

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [check-linux, check-android, a11y-audit, security, performance]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "=== Slint PoC CI Summary ==="
          echo "Linux build: ${{ needs.check-linux.result }}"
          echo "Android build: ${{ needs.check-android.result }}"
          echo "A11y audit: ${{ needs.a11y-audit.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Performance: ${{ needs.performance.result }}"
          
          if [[ "${{ needs.check-linux.result }}" == "success" && \
                "${{ needs.check-android.result }}" == "success" && \
                "${{ needs.a11y-audit.result }}" == "success" && \
                "${{ needs.security.result }}" == "success" ]]; then
            echo "✅ ALL GATES PASSED"
            exit 0
          else
            echo "❌ SOME GATES FAILED"
            exit 1
          fi