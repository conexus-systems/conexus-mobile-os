[package]
name = "conexus-poc-slint"
version = "0.1.0"
edition = "2021"
description = "Conexus Harmattan PoC - Slint Framework"
license = "Apache-2.0"
repository = "https://github.com/conexus-systems/conexus-mobile-os"
rust-version = "1.75"

[dependencies]
slint = { version = "1.2", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
thiserror = "1"
async-trait = "0.1"
dirs = "5"

# Android-specific (conditional compilation)
[target.'cfg(target_os = "android")'.dependencies]
slint-android = { version = "0.1", features = ["std"] }
ndk-glue = "0.9"
ndk-sys = "0.8"
jni = { version = "0.21", features = ["std"] }

[build-dependencies]
slint-build = "1.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true