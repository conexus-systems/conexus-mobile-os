# Flash method
FLASH_METHOD="fastboot"
FLASH_BOOT_PARTITION="boot"
FLASH_ROOTFS_PARTITION="userdata"  # Lumia usa userdata para rootfs

# Post-flash
POST_FLASH_REBOOT="yes"
POST_FLASH_WAIT_SECONDS=30