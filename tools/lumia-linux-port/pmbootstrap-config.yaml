# pmbootstrap config for Nokia Lumia 730/735 (nokia-superman)
# Gerado automaticamente por ./lumia-port.sh init
# Não edite manualmente — rode ./lumia-port.sh init novamente se precisar mudar

# Device
DEVICE_VENDOR="nokia"
DEVICE_CODENAME="superman"
DEVICE_ARCH="armhf"
DEVICE_NAME="Nokia Lumia 730/735"

# Kernel
KERNEL_FLAVOR="downstream"
KERNEL_PKG="linux-nokia-superman"
KERNEL_VERSION="4.19"  # Downstream kernel version
KERNEL_CMDLINE="console=ttyMSM0,115200n8 earlycon=msm_serial_dm,0x78B0000 androidboot.hardware=eagle androidboot.bootdevice=7824900.sdhci lpm_levels.sleep_disabled=1 msm_rtb.filter=0x237 service_locator.enable=1 swiotlb=2048 firmware_class.path=/vendor/firmware_mnt/image loop.max_part=7"

# UI
UI="none"
# Alternativas para testar (não funcionam sem display driver):
# UI="weston"      # Wayland compositor (precisa DRM/KMS)
# UI="phosh"       # Phone shell (precisa display)
# UI="plasma-mobile"  # KDE Plasma Mobile (precisa display + GPU)
# UI="sxmo"        # Simple X Mobile (precisa X11 + display)

# Rootfs
USERNAME="user"
PASSWORD_HASH="$6$rounds=656000$lumia123$..."  # Senha: lumia123 (mude após primeiro boot)
FULL_DISK_ENCRYPTION="no"

# Mirrors
MIRROR="https://mirror.postmarketos.org"
ALLOW_UNTRUSTED="yes"

# Build options
PARALLEL_JOBS="$(nproc)"
CCACHE="yes"
APORTS_DIR="${WORK_DIR}/aports"
CACHE_DIR="${WORK_DIR}/cache"
TEMP_DIR="${WORK_DIR}/tmp"

# Device-specific packages (aports)
DEVICE_PACKAGES="
    device-nokia-superman
    linux-nokia-superman
    firmware-nokia-superman
"

# Extra packages for development
