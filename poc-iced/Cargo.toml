[package]
name = "conexus-poc-iced"
version = "0.1.0"
edition = "2021"
description = "Conexus Harmattan PoC - Iced Framework"
license = "Apache-2.0"
repository = "https://github.com/conexus-systems/conexus-mobile-os"
rust-version = "1.75"

[dependencies]
iced = { version = "0.12", features = ["wgpu"] }
iced_wgpu = "0.12"
iced_native = "0.12"
wgpu = "0.19"
winit = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
thiserror = "1"
async-trait = "0.1"
dirs = "5"
image = "0.24"

# Android-specific
[target.'cfg(target_os = "android")'.dependencies]
ndk-glue = "0.9"
ndk-sys = "0.8"
jni = { version = "0.21", features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true